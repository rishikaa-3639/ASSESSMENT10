apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-monitor-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: equipment-monitor
  template:
    metadata:
      labels:
        app: equipment-monitor
    spec:
      containers:
      - name: monitor
        image: Rishikaa3639/equipment-monitor:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-monitor-service
spec:
  type: NodePort
  selector:
    app: equipment-monitor
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
